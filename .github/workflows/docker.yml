# ============================================================================
# .github/workflows/docker.yml — Build + smoke test Docker image
# ============================================================================
# Triggered manually only (workflow_dispatch).
# Auto-trigger on push is disabled while the codebase is under active
# development. To run: Actions → Docker → Run workflow.
# ============================================================================

name: Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3059

  build:
    name: Build + Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: onyx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size
        run: docker images onyx:test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Start container
        run: |
          docker run -d \
            --name onyx-test \
            -p 8000:8000 \
            -e OPENAI_API_KEY=dummy-key-for-smoke-test \
            -e OPENAI_BASE_URL=https://api.openai.com/v1 \
            -e LLM_MODEL=gpt-4o-mini \
            -e EMBED_MODEL=text-embedding-3-small \
            -e DATA_DIR=/tmp/onyx-data \
            -e LOG_LEVEL=WARNING \
            onyx:test

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up after ${i} attempts"
              break
            fi
            sleep 2
          done

      - name: Smoke test — /health
        run: |
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || (echo "❌"; exit 1)
          echo "✅ Health check passed"

      - name: Smoke test — /skills
        run: |
          curl -fsS http://localhost:8000/skills
          echo ""

      - name: Smoke test — /version
        run: curl -fsS http://localhost:8000/version

      - name: Container logs on failure
        if: failure()
        run: docker logs onyx-test

      - name: Tear down
        if: always()
        run: |
          docker stop onyx-test || true
          docker rm onyx-test || true
