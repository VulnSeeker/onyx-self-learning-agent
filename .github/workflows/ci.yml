# ============================================================================
# .github/workflows/ci.yml — Python tests + lint + type check
# ============================================================================
# Triggered manually only (workflow_dispatch).
# Auto-trigger on push is disabled while the codebase is under active
# development. To run: Actions → CI → Run workflow.
# ============================================================================

name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Lint with ruff
        run: ruff check src tests --output-format=github

      - name: Check formatting
        run: ruff format --check src tests
        continue-on-error: true

      - name: Type check with mypy
        run: mypy src
        continue-on-error: true

      - name: Run tests
        run: pytest -v --tb=short
